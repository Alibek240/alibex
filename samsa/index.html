<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProductHub - Тауарларды басқару жүйесі</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Жеке стигтер файлы -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 font-sans">

    <!-- Header -->
    <header class="bg-white shadow-sm py-4 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="showMainView()">
            <div class="bg-blue-600 text-white p-2 rounded-lg">
                <i class="fa-solid fa-box text-xl"></i>
            </div>
            <span class="text-xl font-bold text-gray-800">ProductHub</span>
        </div>
        <div class="text-sm text-gray-500">Әкімші</div>
    </header>

    <!-- БАСТЫ БЕТ (Тауарлар панелі) -->
    <main id="main-view" class="p-6 max-w-7xl mx-auto space-y-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">Тауарларды басқару</h1>
            <p class="text-sm text-gray-500">Басқару панелі</p>
        </div>

        <!-- Statistics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-500">Барлық тауарлар</p>
                    <h3 id="total-count" class="text-xl font-bold text-gray-800">0</h3>
                </div>
                <div class="bg-blue-50 text-blue-600 p-3 rounded-lg"><i class="fa-solid fa-boxes-stacked"></i></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-500">Жалпы құны</p>
                    <h3 id="total-price" class="text-xl font-bold text-gray-800">0 ₸</h3>
                </div>
                <div class="bg-green-50 text-green-600 p-3 rounded-lg"><i class="fa-solid fa-wallet"></i></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-500">Орташа бағасы</p>
                    <h3 id="avg-price" class="text-xl font-bold text-gray-800">0 ₸</h3>
                </div>
                <div class="bg-purple-50 text-purple-600 p-3 rounded-lg"><i class="fa-solid fa-chart-line"></i></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-500">Аз қалған</p>
                    <h3 id="low-stock" class="text-xl font-bold text-gray-800">0</h3>
                </div>
                <div class="bg-amber-50 text-amber-600 p-3 rounded-lg"><i class="fa-solid fa-triangle-exclamation"></i></div>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Form Section -->
            <div class="bg-white p-6 rounded-xl shadow-sm h-fit">
                <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-circle-plus text-blue-600"></i> Жаңа тауар қосу
                </h2>
                <form id="product-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Тауар атауы *</label>
                        <input type="text" id="name" required placeholder="Тауар атауы" class="w-full text-sm border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Санат *</label>
                        <select id="category" class="w-full text-sm border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="Электроника">Электроника</option>
                            <option value="Парфюмерия">Парфюмерия</option>
                            <option value="Косметикалар">Косметикалар</option>
                            <option value="Тұрмыстық-техника">Тұрмыстық-техника</option>
                            <option value="Жиһаз">Жиһаз</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Бағасы (₸) *</label>
                        <input type="number" id="price" required placeholder="Бағасы" class="w-full text-sm border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Саны (қоймада) *</label>
                        <input type="number" id="stock" required placeholder="10" class="w-full text-sm border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Сурет сілтемесі (URL)</label>
                        <input type="url" id="image" placeholder="https://..." class="w-full text-sm border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition duration-200 text-sm">
                        <i class="fa-solid fa-plus mr-1"></i> Тауарды қосу
                    </button>
                </form>
            </div>

            <!-- Table & Grid Section -->
            <div class="bg-white p-6 rounded-xl shadow-sm lg:col-span-2 space-y-4">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                        <i class="fa-solid fa-list text-blue-600"></i> Тауарлар тізімі
                    </h2>

                    <!-- Көрініс түрін ауыстыру батырмалары (тек белгішелер) -->
                    <div class="flex items-center bg-gray-100 p-1 rounded-lg shrink-0 space-x-1">
                        <button type="button" id="view-table-btn" onclick="switchView('table')" class="w-9 h-9 flex items-center justify-center rounded-md transition bg-white text-blue-600 shadow-sm" title="Тізім түрінде">
                            <i class="fa-solid fa-table-list"></i>
                        </button>
                        <button type="button" id="view-grid-btn" onclick="switchView('grid')" class="w-9 h-9 flex items-center justify-center rounded-md transition text-gray-600 hover:text-gray-800" title="Қатарымен (Карточка)">
                            <i class="fa-solid fa-grip"></i>
                        </button>
                    </div>
                </div>

                <!-- Filters & Search -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-sm"></i>
                        <input type="text" id="search-input" placeholder="Атауы бойынша іздеу..." class="w-full text-sm pl-9 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <select id="category-filter" class="w-full text-sm py-2 px-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Барлық санаттар</option>
                            <option value="Электроника">Электроника</option>
                            <option value="Парфюмерия">Парфюмерия</option>
                            <option value="Косметикалар">Косметикалар</option>
                            <option value="Тұрмыстық-техника">Тұрмыстық-техника</option>
                            <option value="Жиһаз">Жиһаз</option>
                        </select>
                    </div>
                    <div>
                        <select id="sort-filter" class="w-full text-sm py-2 px-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="newest">Жаңадан ескіге</option>
                            <option value="oldest">Ескіден жаңаға</option>
                            <option value="price-high">Бағасы: жоғарыдан</option>
                            <option value="price-low">Бағасы: төменнен</option>
                        </select>
                    </div>
                </div>

                <!-- 1. Тізім түрі (Кесте) -->
                <div id="table-view-container" class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b text-xs text-gray-400 uppercase">
                                <th class="py-3 px-2">ID</th>
                                <th class="py-3 px-2">Тауар және Қосқан адам</th>
                                <th class="py-3 px-2">Санат</th>
                                <th class="py-3 px-2">Бағасы</th>
                                <th class="py-3 px-2">Қоймада</th>
                                <th class="py-3 px-2 text-right">Әрекеттер</th>
                            </tr>
                        </thead>
                        <tbody id="product-table-body" class="text-sm divide-y"></tbody>
                    </table>
                </div>

                <!-- 2. Қатарымен түрі (Карточкалар торы) -->
                <div id="grid-view-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4 hidden"></div>
            </div>
        </div>
    </main>

    <!-- ПРОФИЛЬ БЕТІ -->
    <div id="profile-view" class="p-6 max-w-7xl mx-auto space-y-6 hidden">
        <button onclick="showMainView()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium text-sm rounded-lg transition flex items-center gap-2 w-fit">
            <i class="fa-solid fa-arrow-left"></i> Артқа қайту
        </button>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Сол жақ: Профиль -->
            <div class="bg-white p-6 rounded-2xl shadow-sm space-y-6 h-fit">
                <div class="flex flex-col items-center text-center space-y-3 pb-6 border-b">
                    <img id="prof-avatar" src="" alt="" class="w-28 h-28 rounded-full object-cover border-4 border-blue-600 shadow-md">
                    <div>
                        <h2 id="prof-name" class="text-xl font-bold text-gray-800"></h2>
                        <p id="prof-username" class="text-blue-600 font-medium bg-blue-50 px-3 py-1 rounded-full inline-block text-xs mt-1"></p>
                    </div>
                </div>

                <div class="space-y-4 text-sm text-gray-700">
                    <div>
                        <p class="text-gray-400 text-xs">Электрондық пошта</p>
                        <p id="prof-email" class="font-semibold text-gray-800 mt-0.5 break-all"></p>
                    </div>
                    <div>
                        <p class="text-gray-400 text-xs">Телефон нөмірі</p>
                        <p id="prof-phone" class="font-semibold text-gray-800 mt-0.5"></p>
                    </div>
                    <div>
                        <p class="text-gray-400 text-xs">Компания</p>
                        <p id="prof-company" class="font-semibold text-gray-800 mt-0.5"></p>
                    </div>
                </div>
            </div>

            <!-- Оң жақ: Тауарлары -->
            <div class="bg-white p-6 rounded-2xl shadow-sm md:col-span-2 space-y-4">
                <h3 class="text-lg font-bold text-gray-800 pb-2 border-b flex items-center gap-2">
                    <i class="fa-solid fa-boxes-stacked text-blue-600"></i> Қосқан тауарлары
                </h3>
                <div id="user-products-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>

        </div>
    </div>

    <!-- EDIT MODAL -->
    <div id="edit-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 hidden">
        <div class="bg-white w-full max-w-xl rounded-2xl shadow-2xl p-6 relative animate-scale">
            <div class="flex justify-between items-center pb-4 border-b">
                <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-blue-600"></i> Тауарды өңдеу
                </h3>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="edit-form" class="space-y-4 pt-4">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Тауар атауы *</label>
                    <input type="text" id="edit-name" required class="w-full text-sm border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Категория *</label>
                        <select id="edit-category" class="w-full text-sm border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="Электроника">Электроника</option>
                            <option value="Парфюмерия">Парфюмерия</option>
                            <option value="Косметикалар">Косметикалар</option>
                            <option value="Тұрмыстық-техника">Тұрмыстық-техника</option>
                            <option value="Жиһаз">Жиһаз</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Бағасы (₸) *</label>
                        <input type="number" id="edit-price" required class="w-full text-sm border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Саны (қоймада) *</label>
                        <input type="number" id="edit-stock" required class="w-full text-sm border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Сурет сілтемесі (URL)</label>
                        <input type="url" id="edit-image" class="w-full text-sm border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-medium rounded-lg transition">Бас тарту</button>
                    <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition flex items-center gap-1.5"><i class="fa-solid fa-floppy-disk"></i> Сақтау</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JS файлы -->
    <script src="script.js"></script>
</body>
</html>
